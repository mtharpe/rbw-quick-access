name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-linux:
    runs-on: linux-x86
    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Set up Python
        uses: https://data.forgejo.org/actions/setup-python@v6
        with:
          python-version: "3.10.21"

      - name: Install Dependencies
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build Linux artifact
        run: |
          chmod +x scripts/build.linux.sh
          scripts/build.linux.sh "${FORGEJO_REF_NAME#v}"

      - name: Upload Linux artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: linux
          path: |
            rbw-quick-access-linux-*.tar.gz

  build-macos:
    runs-on: macos-arm64

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Set up Python
        run: |
          /opt/homebrew/opt/python@3.10/bin/python3.10 -m venv .venv
          source .venv/bin/activate

      - name: Install Dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build macOS artifacts
        run: |
          source .venv/bin/activate
          chmod +x scripts/build.macos.sh
          scripts/build.macos.sh "${FORGEJO_REF_NAME#v}"

      - name: Upload macOS artifacts
        uses: https://data.forgejo.org/actions/upload-artifact@v3
        with:
          name: macos
          path: |
            rbw-quick-access-macos-*.tar.gz

  release:
    # This can be any runner really.
    runs-on: linux-x86

    needs:
      - build-linux
      - build-macos

    steps:
      - name: Checkout
        uses: https://data.forgejo.org/actions/checkout@v6

      - name: Create release notes
        shell: bash
        run: |
          version="${FORGEJO_REF_NAME#v}"

          {
            echo "Released by @${FORGEJO_ACTOR}"
            echo
            awk -v version="$version" '
              $0 ~ "^## \\[" version "\\]" {
                found = 1
                next
              }

              found && /^## \[/ {
                exit
              }

              found {
                print
              }
            ' CHANGELOG.md
          } > release-notes.md

          echo "Release notes:"
          cat release-notes.md

      - name: Show release notes
        run: cat release-notes.md

      - name: Download macOS artifacts
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: macos
          path: release-assets

      - name: Download Linux artifacts
        uses: https://data.forgejo.org/actions/download-artifact@v3
        with:
          name: linux
          path: release-assets

      - name: List release assets
        run: |
          find release-assets -type f -maxdepth 2 -print

      - name: Create Forgejo release
        uses: https://data.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          release-dir: release-assets
          tag: ${{ forgejo.ref_name }}
          title: ${{ forgejo.ref_name }}
          release-notes-file: release-notes.md
